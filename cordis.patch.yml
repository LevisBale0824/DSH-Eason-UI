# ============================================================================
# Aqua（玻璃主题）的 bundle patch —— 把插件挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   DSH 启动时按 bundle 层栈把各插件的 patch 叠起来组成配置树，本文件是
#   这一层的内容：插入一行 ui-aqua 插件（宿主半侧解析到 lib/index.js，
#   浏览器半侧经 package.json 的 dsh.client 声明自动发现）。
#
# 【config 说明】
#   config 传给宿主半侧 apply(ctx, config)：
#   - wallpaperRoot：壁纸存储目录（默认 $DSH_HOME/aqua-wallpaper，一般不用改）
#   浏览器半侧收不到这些配置（DSH 客户端管线限制）。
#
# ============================================================================

- insert:
    - id: ui-aqua                       # 插件行 id（与宿主半侧 name 一致）
      name: '@levisbale0824/dsh-client-ui-aqua'  # 模块名：解析到 lib/index.js
      # config:
      #   wallpaperRoot: ''             # 例：覆盖默认壁纸存储路径
